name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck • test • build
    # macOS because the repo also hosts iOS/macOS RN clients. We do NOT run
    # xcodebuild here (too slow + needs Apple Dev signing); CI only covers the
    # JS/TS side — typecheck, unit tests, and the web UI bundle.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.11

      # Cache the global Bun install cache + the resolved node_modules trees.
      # Keyed on the lockfile so a dependency change busts it.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            voix-backend/node_modules
            voix-backend/ui/node_modules
            clients/app/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Repo-level invariant guards (native siblings, protocol sync, pin bounds).
      - name: Repo checks (bun run check)
        run: bun run check

      # Daemon unit tests (140+ tests across the pipeline providers).
      - name: Backend tests
        working-directory: voix-backend
        run: bun test

      # Daemon typecheck — tsc --noEmit against voix-backend/tsconfig.json.
      - name: Backend typecheck
        working-directory: voix-backend
        run: bun run typecheck

      # Web UI: tsc --noEmit + vite production build.
      - name: UI build
        working-directory: voix-backend/ui
        run: bun run build

      # RN client (clients/app): typecheck only — no xcodebuild in CI.
      - name: App typecheck
        run: bunx tsc -p clients/app/tsconfig.json --noEmit
