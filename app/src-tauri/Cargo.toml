[package]
name = "voix-app"
version = "0.1.0"
description = "Voix companion — HA event subscriber that pushes transcripts to the macOS clipboard and (optionally) pastes them into the frontmost app."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# REST client for HA states queries (device + mode enumeration). Routing
# these through Rust sidesteps the webview's CORS rules — HA doesn't
# return CORS headers for the tauri:// origin so a JS fetch() fails with
# "load failed" even though the underlying WS auth works fine.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# Pin a crypto provider so rustls 0.23 (transitive via tokio-tungstenite)
# can pick one without us choosing at runtime. aws-lc-rs is the default
# in newer rustls releases and works on Apple Silicon without surprises.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
futures-util = "0.3"
url = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native macOS vibrancy for the sidebar — NSVisualEffectView via Tauri's
# window-vibrancy helper. The desktop brand guide is explicit that the
# sidebar uses Liquid Glass on macOS; this gives us that without dipping
# directly into objc.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
