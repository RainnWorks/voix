# Tom's Voice PE — minimal device YAML.
#
# Everything voix-specific is in voix-package.yaml; everything Voice PE
# hardware-specific is in the upstream package. This YAML is just the
# per-device identity. WS URL + shared token + mode state get pushed by
# the voix HA integration after HA's standard ESPHome adoption — no
# substitutions, no secrets needed for voix itself.
#
# (The api.encryption.key + wifi block below are kept because I'm
# compiling via the CLI rather than HA's ESPHome dashboard adoption
# path. End users adopting via the dashboard get those injected
# automatically.)

packages:
  voice_pe:
    url: https://github.com/esphome/home-assistant-voice-pe
    files:
      - home-assistant-voice.8mb.yaml
    # 26.5.0 fixes issue #582 (stale esphome@ff8ce89 pin breaking mWW).
    # Requires ESPHome dashboard >= 2026.5.0.
    ref: 26.5.0
    refresh: 1d
  # Local include during development. Switch to a git-fetched ref once
  # the voix repo is published; pattern:
  #   voix:
  #     url: https://github.com/thenairn/voix
  #     files: [esphome/voix-package.yaml]
  #     ref: main
  voix: !include voix-package.yaml

esphome:
  name: home-assistant-voice-095e4e
  name_add_mac_suffix: false

api:
  encryption:
    key: !secret voice_pe_095e4e_api_key

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
