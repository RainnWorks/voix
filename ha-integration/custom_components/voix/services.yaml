cycle_mode:
  name: Cycle voix mode
  description: >-
    Advance the voix mode select to the next mode in the global catalog
    (wraps at the end). Called by the Voice PE center button.
  fields:
    device_id:
      name: Device ID
      description: >-
        Target a specific Voice PE if multiple are discovered. The device_id
        is the ESPHome name (e.g. "home-assistant-voice-095e4e"). Omit if
        you only have one Voice PE.
      example: "home-assistant-voice-095e4e"
      required: false
      selector:
        text:

set_mode:
  name: Set voix mode
  description: >-
    Directly set the voix mode for a device. The `mode` argument is the
    mode id from the global catalog (e.g. "default-assist", "default-realtime",
    or any user-created id like "work" or "home"). See Options → Modes
    for the current list; or read `select.voix_mode_<device>.attributes.options`.
  fields:
    mode:
      name: Mode ID
      description: >-
        ID of a mode from entry.options['modes'] (NOT a behavior type).
        Free-text because the catalog is user-defined; an invalid id logs
        a warning and the service is a no-op.
      required: true
      example: "default-realtime"
      selector:
        text:
    device_id:
      name: Device ID
      description: >-
        Target a specific Voice PE. Omit for single-device installs.
      required: false
      example: "home-assistant-voice-095e4e"
      selector:
        text:

get_transcript:
  name: Get transcript
  description: >-
    Read the contents of a transcript file. Pass the filepath from a
    transcript sensor's state. Returns response data: content, char_count,
    modified_ns. The filepath must be under <config>/voix/transcripts/.
  fields:
    filepath:
      name: Transcript filepath
      description: >-
        Absolute path to the transcript file (typically the state value of
        sensor.voix_user_transcript_<device> or
        sensor.voix_assistant_transcript_<device>).
      required: true
      example: "/config/voix/transcripts/home-assistant-voice-095e4e/abc123-user.txt"
      selector:
        text:

list_modes:
  name: List modes
  description: >-
    Return the full mode catalog with every field (prompt, voice, model,
    color, brightness, effect). Used by the desktop app to populate the
    mode editor — HA's UI only exposes color/brightness/effect via the
    per-mode light entities.
