# Home Assistant Add-on manifest.
#
# Users install by adding this repo as a Home Assistant Add-on
# repository (Settings → Add-ons → Add-on store → ⋮ → Repositories →
# add `https://github.com/thenairn/voix`), then "voix backend" appears
# in the store ready to install.
#
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration/

name: voix backend
version: "0.1.0"
slug: voix-backend
description: >-
  Daemon that bridges Voice PE pucks to OpenAI Realtime. Owns the
  realtime session, dictation pipeline, post-processing, and MCP-based
  context gathering. The HA "voix" integration (separate) does device
  discovery + onboarding; the brain runs here.

# Build for ARM (Pi 4 / Home Assistant Yellow) + x86_64 (NUC / generic
# Docker hosts). 32-bit and armv7 aren't worth the test matrix yet —
# add them if anyone asks.
arch:
  - aarch64
  - amd64

# init: false → Bun is our PID 1. We don't need s6-overlay's
# multi-service init system; the daemon is one process.
init: false

# `services` startup → start after HA core comes up. Pucks won't try to
# connect until we've adopted them anyway, so we don't need to race the
# rest of the stack.
startup: services
boot: auto

# Expose the daemon's WS port on the host. Without this the puck can't
# reach the add-on across the LAN. Default 8765 — users can remap via
# the UI if they have a conflict.
ports:
  "8765/tcp": 8765
ports_description:
  "8765/tcp": Voice PE WebSocket bridge

# Host networking is NOT needed — the puck reaches us via the mapped
# port. Avoiding host net means the add-on respects HA's network
# isolation.
host_network: false

# Add-on options exposed in the HA UI. The user sets these in
# Settings → Add-ons → voix backend → Configuration; HA writes the
# values into /data/options.json which env.ts reads at boot.
options:
  openai_api_key: ""
  openrouter_api_key: ""
  ws_token: ""
  ha_url: "http://supervisor/core"
  ha_token: ""
  log_level: info
  dev_mode: false
  dev_repo: "https://github.com/RainnWorks/voix.git"
  dev_branch: "main"
  dev_poll_s: 30

# Schema validates user input and produces the form widget types.
# str/password/url = field type, list(a|b|c) = dropdown, ? = optional.
schema:
  openai_api_key: password
  openrouter_api_key: password?
  ws_token: password
  ha_url: url?
  ha_token: password?
  log_level: list(trace|debug|info|warn|error)
  dev_mode: bool
  dev_repo: url
  dev_branch: str
  dev_poll_s: int(5,300)

# Map for documentation purposes. HA shows these in the Configuration
# tab's tooltips so users don't have to guess what each field does.
options_description:
  openai_api_key: >-
    OpenAI API key. Used for Realtime (puck conversations), transcription
    (dictation), and post-processing (Email/Message/Note/Code modes).
    Create one at platform.openai.com.
  openrouter_api_key: >-
    Optional OpenRouter key. Only needed for modes that pick OpenRouter
    as their post-processing LLM provider. Leave blank if you only use
    OpenAI for post-processing.
  ws_token: >-
    Shared secret pucks must present in their WS hello. Auto-generated
    if left blank — copy the generated value from the add-on logs into
    your ESPHome puck config (`voix_ws_token` in secrets.yaml).
  ha_url: >-
    Base URL the daemon uses to reach HA's MCP server. Default
    `http://supervisor/core` works when running as an add-on. Override
    if you have an unusual setup.
  ha_token: >-
    HA long-lived access token, used by the daemon's MCP client to
    fetch areas/persons/exposed-entity state and call HA tools
    (HassTurnOn, HassLightSet, etc.) on the model's behalf. Create one
    under your HA user profile → Long-lived access tokens. Leave blank
    to run without HA tools — pucks still work for dictation.
  log_level: >-
    `info` is the default. Use `debug` for protocol-level visibility
    when something's misbehaving.
